
server:
  port: 8080

spring:
  application:
    name: API-Gateway
  profiles:
    active: local

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false

      routes:
        # AI Microservice
        - id: ai-service
          uri: lb://AI-MICROSERVICE
          predicates:
            - Path=/api/v1/ai/**

        # Identity Microservice
        - id: identity-service
          uri: lb://IDENTITY-MICROSERVICE
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/addresses/**

        # Catalog Microservice
        - id: catalog-service
          uri: lb://CATALOG-MICROSERVICE
          predicates:
            - Path=/api/v1/brands/**,/api/v1/categories/**,/api/v1/products/**,/api/v1/reviews/**

        # Inventory Microservice
        - id: inventory-service
          uri: lb://INVENTORY-MICROSERVICE
          predicates:
            - Path=/api/v1/inventories/**

        # Cart Microservice
        - id: cart-service
          uri: lb://CART-MICROSERVICE
          predicates:
            - Path=/api/v1/carts/**,/api/v1/cart-items/**

        # Order Microservice
        - id: order-service
          uri: lb://ORDER-MICROSERVICE
          predicates:
            - Path=/api/v1/orders/**

        # Payment Microservice
        - id: payment-service
          uri: lb://PAYMENT-MICROSERVICE
          predicates:
            - Path=/api/v1/payments/**

        # Notification Microservice
        - id: notification-service
          uri: lb://NOTIFICATION-MICROSERVICE
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/notification-preferences/**

services:

  # ==============================
  # Eureka Server
  # ==============================
  eureka-server:
    image: eureka-server:v1
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT}:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8761
    networks:
      - ecommerce-network


  # ==============================
  # Identity MySQL Database
  # ==============================
  identity-mysql:
    image: mysql:8.4
    container_name: identity-mysql
    restart: unless-stopped
    ports:
      - "${IDENTITY_MYSQL_HOST_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${IDENTITY_DATABASE}
      MYSQL_USER: ${IDENTITY_USER}
      MYSQL_PASSWORD: ${IDENTITY_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${IDENTITY_ROOT_PASSWORD}
    volumes:
      - identity-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-network


  # ==============================
  # Identity Service
  # ==============================
  identity-service:
    image: identity-microservice:v1
    container_name: identity-service
    restart: unless-stopped
    ports:
      - "${IDENTITY_SERVICE_HOST_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: identity-service
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://identity-mysql:3306/${IDENTITY_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${IDENTITY_USER}
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      identity-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network




  # ==============================
  # Catalog MongoDB
  # ==============================
  catalog-mongodb:
    image: mongo:8.0
    container_name: catalog-mongodb
    restart: unless-stopped
    ports:
      - "${CATALOG_MONGO_HOST_PORT}:27017"
    volumes:
      - catalog-mongodb-data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce-network




  # ==============================
  # Catalog Service
  # ==============================
  catalog-service:
    image: catalog-microservice:v1
    container_name: catalog-service
    restart: unless-stopped
    ports:
      - "${CATALOG_SERVICE_HOST_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: catalog-service
      SERVER_PORT: 8082
      SPRING_DATA_MONGODB_URI: mongodb://${CATALOG_MONGO_HOST}:${CATALOG_MONGO_PORT}/${CATALOG_MONGO_DATABASE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      catalog-mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network


  # ==============================
  # Inventory PostgreSQL Database
  # ==============================
  inventory-postgres:
    image: postgres:17
    container_name: inventory-postgres
    restart: unless-stopped
    ports:
      - "${INVENTORY_POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${INVENTORY_DATABASE}
      POSTGRES_USER: ${INVENTORY_USER}
      POSTGRES_PASSWORD: ${INVENTORY_PASSWORD}
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network


  # ==============================
  # Inventory Service
  # ==============================
  inventory-service:
    image: inventory-microservice:v1
    container_name: inventory-service
    restart: unless-stopped
    ports:
      - "${INVENTORY_SERVICE_HOST_PORT}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: inventory-service
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-postgres:5432/${INVENTORY_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${INVENTORY_USER}
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      inventory-postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network


  # ==============================
  # Redis Database
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - ecommerce-network


  # ==============================
  # Cart Service
  # ==============================
  cart-service:
    image: cart-microservice:v1
    container_name: cart-service
    restart: unless-stopped
    ports:
      - "${CART_SERVICE_HOST_PORT}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: cart-service
      SERVER_PORT: 8084
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network


  # ==============================
  # Order PostgreSQL Database
  # ==============================
  order-postgres:
    image: postgres:17
    container_name: order-postgres
    restart: unless-stopped
    ports:
      - "${ORDER_POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${ORDER_DATABASE}
      POSTGRES_USER: ${ORDER_USER}
      POSTGRES_PASSWORD: ${ORDER_PASSWORD}
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network


  # ==============================
  # Order Service
  # ==============================
  order-service:
    image: order-microservice:v1
    container_name: order-service
    restart: unless-stopped
    ports:
      - "${ORDER_SERVICE_HOST_PORT}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: order-service
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/${ORDER_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${ORDER_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      order-postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network


  # ==============================
  # Notification PostgreSQL Database
  # ==============================
  notification-postgres:
    image: postgres:17
    container_name: notification-postgres
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${NOTIFICATION_DATABASE}
      POSTGRES_USER: ${NOTIFICATION_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_PASSWORD}
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network


  # ==============================
  # Notification Service
  # ==============================
  notification-service:
    image: notification-microservice:v1
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: notification-service
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-postgres:5432/${NOTIFICATION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      notification-postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network


  # ==============================
  # Payment PostgreSQL Database
  # ==============================
  payment-postgres:
    image: postgres:17
    container_name: payment-postgres
    restart: unless-stopped
    ports:
      - "${PAYMENT_POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${PAYMENT_DATABASE}
      POSTGRES_USER: ${PAYMENT_USER}
      POSTGRES_PASSWORD: ${PAYMENT_PASSWORD}
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network


  # ==============================
  # Payment Service
  # ==============================
  payment-service:
    image: payment-microservice:v1
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "${PAYMENT_SERVICE_HOST_PORT}:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: payment-service
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-postgres:5432/${PAYMENT_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      payment-postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network


  # ==============================

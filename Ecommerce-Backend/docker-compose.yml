  # ==============================
  ai-service:
    image: ai-microservice:v1
    container_name: ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_HOST_PORT}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: ai-service
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://ai-postgres:5432/${AI_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${AI_USER}
      SPRING_DATASOURCE_PASSWORD: ${AI_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      ai-postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network


  # ==============================
  # API Gateway
  # ==============================
  api-gateway:
    image: api-gateway:v1
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_HOST_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: API-Gateway
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - ecommerce-network



# ==============================
# Docker Network
# ==============================
networks:
  ecommerce-network:
    driver: bridge


# ==============================
# Persistent Volumes
# ==============================
volumes:
  identity-mysql-data:
  catalog-mongodb-data:
  inventory-postgres-data:
  redis-data:
  order-postgres-data:
  notification-postgres-data:
  payment-postgres-data:
  ai-postgres-data:

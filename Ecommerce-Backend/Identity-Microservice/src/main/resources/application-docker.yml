
spring:
  datasource:
    url: jdbc:mysql://identity-mysql:3306/${IDENTITY_DATABASE}
    username: ${IDENTITY_USER}
    password: ${IDENTITY_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
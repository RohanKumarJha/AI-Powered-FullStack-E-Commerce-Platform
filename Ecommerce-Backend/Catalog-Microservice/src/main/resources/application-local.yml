
spring:
  data:
    mongodb:
      uri: mongodb://${CATALOG_MONGO_USERNAME}:${CATALOG_MONGO_PASSWORD}@localhost:${CATALOG_MONGO_PORT:27017}/${CATALOG_MONGO_DATABASE}?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
